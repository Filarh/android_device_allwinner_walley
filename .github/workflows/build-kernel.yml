name: Compilar kernel

# Reconstruir el kernel 4.9.170 de esta caja desde fuentes.
#
# Por que se puede: el defconfig del arbol de OrangePi
# (sun50iw9p1smp_h616_android_defconfig) comparte 1373 opciones con el config
# vivo de la caja y NINGUNA con valor distinto. El firmware salio de ese BSP.
#
# ESTE PRIMER BUILD VA SIN KernelSU Y SIN EL WiFi, a proposito. Lo unico que
# tiene que contestar es: ¿el arbol produce un kernel que arranca en esta caja?
#
# Referencia de fabrica (extraida del boot.img de la caja):
#   Image        18651144 bytes
#   version      4.9.170 #38 SMP PREEMPT, gcc Linaro 5.3-2016.05
#   magia ARM64  "ARMd" en el offset 56
#   la particion boot son 33554432 bytes y hoy sobran 14006272 (41,7%)

"on":
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Rama del arbol de OrangePi"
        default: "orange-pi-4.9-sun50iw9"
      gcc:
        description: "Version de gcc cruzado (9, 10, 11, 12)"
        default: "9"

jobs:
  build:
    # 22.04 y no latest: 24.04 solo trae gcc 12/13/14, demasiado nuevos para
    # codigo de 4.9. El kernel original se hizo con Linaro GCC 5.3 de 2016.
    runs-on: ubuntu-22.04
    steps:
      - name: Traer nuestro repo
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Espacio disponible
        run: df -h /

      # OJO: todos los pasos llevan 'set -o pipefail'. El primer intento fallo
      # en silencio porque 'make ... | tail -60' devuelve el codigo del tail, no
      # el del make: dos pasos quedaron marcados success sin haber compilado
      # nada. Ademas cada paso critico verifica su resultado explicitamente.
      - name: Dependencias y toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev build-essential \
            libncurses-dev python3 rsync kmod cpio device-tree-compiler
          # Se prueban varias versiones porque la disponibilidad cambia entre
          # imagenes del runner. Se usa la primera que instale.
          CC=""
          for v in "${{ github.event.inputs.gcc }}" 9 10 11 12; do
            if sudo apt-get install -y -qq "gcc-$v-aarch64-linux-gnu" 2>/dev/null; then
              CC="aarch64-linux-gnu-gcc-$v"; break
            fi
          done
          if [ -z "$CC" ]; then
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu
            CC="aarch64-linux-gnu-gcc"
          fi
          command -v "$CC" >/dev/null || { echo "ERROR: no hay compilador cruzado"; exit 1; }
          echo "CCOMP=$CC" >> "$GITHUB_ENV"
          echo "--- compilador elegido ---"
          "$CC" --version | head -1

      - name: Clonar el kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/orangepi-xunlong/linux-orangepi.git kernel
          cd kernel
          echo "--- version del arbol ---"
          head -5 Makefile
          test -d arch/arm64 || { echo "ERROR: el arbol no tiene arch/arm64"; exit 1; }
          du -sh .

      - name: Preparar el config
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          cp ../device_tree/kernel/walley_defconfig .config
          # El gcc de Ubuntu se llama aarch64-linux-gnu-gcc-N; el kernel espera
          # CROSS_COMPILE + "gcc", asi que se apunta CC directamente.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CCOMP" olddefconfig
          echo "--- que cambio olddefconfig respecto del config de la caja ---"
          diff <(grep '^CONFIG' ../device_tree/kernel/walley_defconfig | sort) \
               <(grep '^CONFIG' .config | sort) | head -60 || true
          echo "--- opciones finales: $(grep -c '^CONFIG' .config) ---"

      - name: Compilar
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          # sin pipe a tail: enmascara el codigo de salida
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CCOMP" \
               KCFLAGS="-Wno-error" -j"$(nproc)" Image modules

      - name: Verificar el resultado
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          IMG=arch/arm64/boot/Image
          test -f "$IMG" || { echo "ERROR: no se genero el Image"; exit 1; }
          SZ=$(stat -c %s "$IMG")
          echo "  Image      : $SZ bytes"
          echo "  de fabrica : 18651144 bytes"
          echo "  diferencia : $((SZ - 18651144)) bytes"
          echo "  cabe en boot (sobran 14006272 sobre el de fabrica): $([ $SZ -lt 32000000 ] && echo SI || echo NO)"
          MAGIA=$(dd if="$IMG" bs=1 skip=56 count=4 2>/dev/null | xxd -p)
          echo "  magia offset 56: $MAGIA  (debe ser 41524d64 = ARMd)"
          [ "$MAGIA" = "41524d64" ] || { echo "ERROR: no tiene la magia de Image ARM64"; exit 1; }
          echo
          echo "  release: $(cat include/config/kernel.release 2>/dev/null)"
          echo
          N=$(find . -name '*.ko' | wc -l)
          echo "  modulos generados: $N"
          [ "$N" -gt 0 ] || { echo "ERROR: no se genero ningun modulo"; exit 1; }
          find . -name '*.ko' -printf '%10s %f\n' | sort -rn | head -15
          echo
          echo "  --- los que la caja necesita ---"
          for m in mali_kbase uvcvideo videobuf2_core; do
            F=$(find . -name "$m.ko" | head -1)
            printf '  %-18s %s\n' "$m" "${F:-NO SE GENERO}"
          done

      - name: Empaquetar
        if: always()
        shell: bash
        run: |
          mkdir -p salida/modules
          cp kernel/arch/arm64/boot/Image salida/ 2>/dev/null || true
          cp kernel/.config salida/config-usado 2>/dev/null || true
          cp kernel/include/config/kernel.release salida/ 2>/dev/null || true
          find kernel -name '*.ko' -exec cp {} salida/modules/ \; 2>/dev/null || true
          du -sh salida; ls -l salida

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-walley
          path: salida/
          if-no-files-found: warn
