name: Compilar kernel

# Reconstruir el kernel 4.9.170 de esta caja desde fuentes.
#
# Por que se puede: el defconfig del arbol de OrangePi
# (sun50iw9p1smp_h616_android_defconfig) comparte 1373 opciones con el config
# vivo de la caja y NINGUNA con valor distinto. El firmware salio de ese BSP.
#
# ESTE PRIMER BUILD VA SIN KernelSU Y SIN EL WiFi, a proposito. Lo unico que
# tiene que contestar es: ¿el arbol produce un kernel que arranca en esta caja?
# Meter tres variables a la vez haria imposible saber cual fallo.
#
# Referencia contra la que hay que comparar (kernel de fabrica, extraido del
# boot.img de la caja):
#   Image        18651144 bytes
#   version      4.9.170 #38 SMP PREEMPT, gcc Linaro 5.3-2016.05
#   magia ARM64  "ARMd" en el offset 56

"on":
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Rama del arbol de OrangePi"
        default: "orange-pi-4.9-sun50iw9"
      config:
        description: "config a usar: 'vivo' (el de la caja) o el nombre de un defconfig del arbol"
        default: "vivo"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Traer nuestro repo
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Espacio disponible
        run: df -h /

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev build-essential \
            libncurses-dev python3 rsync kmod cpio device-tree-compiler

      # Kernel 4.9 no compila limpio con GCC moderno. Este es el toolchain que
      # AOSP usaba para kernels de esta epoca; el original de la caja fue
      # Linaro GCC 5.3-2016.05 (segun /proc/version), que es de la misma familia.
      - name: Toolchain aarch64 de AOSP
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain
          echo "--- version ---"
          ./toolchain/bin/aarch64-linux-android-gcc --version | head -1

      - name: Clonar el kernel
        run: |
          git clone --depth=1 --single-branch \
            -b ${{ github.event.inputs.kernel_branch }} \
            https://github.com/orangepi-xunlong/linux-orangepi.git kernel
          cd kernel
          echo "--- version del arbol ---"
          head -5 Makefile
          du -sh .

      - name: Preparar el config
        run: |
          cd kernel
          if [ "${{ github.event.inputs.config }}" = "vivo" ]; then
            echo "usando el config EXTRAIDO DE LA CAJA (/proc/config.gz)"
            cp ../device_tree/kernel/walley_defconfig .config
          else
            echo "usando el defconfig del arbol: ${{ github.event.inputs.config }}"
            make ARCH=arm64 ${{ github.event.inputs.config }}
          fi
          export PATH=$PWD/../toolchain/bin:$PATH
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- olddefconfig
          echo "--- que cambio olddefconfig respecto de lo que pedimos ---"
          if [ "${{ github.event.inputs.config }}" = "vivo" ]; then
            diff <(grep '^CONFIG' ../device_tree/kernel/walley_defconfig | sort) \
                 <(grep '^CONFIG' .config | sort) | head -40 || true
          fi

      - name: Compilar
        run: |
          cd kernel
          export PATH=$PWD/../toolchain/bin:$PATH
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- -j$(nproc) Image modules 2>&1 | tail -60

      - name: Anatomia del resultado
        if: always()
        run: |
          cd kernel
          echo "===== Image ====="
          if [ -f arch/arm64/boot/Image ]; then
            ls -l arch/arm64/boot/Image
            echo "  de fabrica: 18651144 bytes"
            printf '  magia en offset 56: '
            dd if=arch/arm64/boot/Image bs=1 skip=56 count=4 2>/dev/null | xxd -p
            echo "  (de fabrica debe ser 41524d64 = ARMd)"
          else
            echo "  NO SE GENERO"
          fi
          echo
          echo "===== version ====="
          cat include/config/kernel.release 2>/dev/null || true
          strings arch/arm64/boot/Image 2>/dev/null | grep -m1 "Linux version" || true
          echo
          echo "===== modulos generados ====="
          find . -name '*.ko' | wc -l
          find . -name '*.ko' -printf '%10s %f\n' | sort -rn | head -20
          echo
          echo "===== los que la caja necesita ====="
          for m in mali_kbase ssv6x5x uvcvideo videobuf2_core; do
            printf '  %-18s ' "$m"
            find . -name "$m.ko" -printf '%s bytes  %p\n' 2>/dev/null | head -1 || echo "NO"
          done

      - name: Empaquetar
        if: always()
        run: |
          mkdir -p salida/modules
          cp kernel/arch/arm64/boot/Image salida/ 2>/dev/null || true
          cp kernel/.config salida/config-usado 2>/dev/null || true
          find kernel -name '*.ko' -exec cp {} salida/modules/ \; 2>/dev/null || true
          ls -lR salida | head -40

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-walley
          path: salida/
          if-no-files-found: warn
