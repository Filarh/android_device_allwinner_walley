name: Compilar kernel

# Reconstruir el kernel 4.9.170 de esta caja desde fuentes.
#
# Por que se puede: el defconfig del arbol de OrangePi
# (sun50iw9p1smp_h616_android_defconfig) comparte 1373 opciones con el config
# vivo de la caja y NINGUNA con valor distinto. El firmware salio de ese BSP.
#
# ESTE PRIMER BUILD VA SIN KernelSU Y SIN EL WiFi, a proposito. Lo unico que
# tiene que contestar es: ¿el arbol produce un kernel que arranca en esta caja?
#
# Referencia de fabrica (extraida del boot.img de la caja):
#   Image        18651144 bytes
#   version      4.9.170 #38 SMP PREEMPT, gcc Linaro 5.3-2016.05
#   magia ARM64  "ARMd" en el offset 56
#   la particion boot son 33554432 bytes y hoy sobran 14006272 (41,7%)

"on":
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repo del kernel"
        default: "https://github.com/orangepi-xunlong/linux-orangepi.git"
      kernel_branch:
        description: "Rama"
        default: "orange-pi-4.9-sun50iw9"
      gcc:
        description: "Version de gcc cruzado (9, 10, 11, 12), o 'linaro5' = el Linaro GCC 5.3.1-2016.05 EXACTO del kernel de fabrica"
        default: "11"
      config:
        description: "'vivo' = el config extraido de la caja; o el nombre de un defconfig del arbol"
        default: "vivo"

jobs:
  build:
    # 22.04 y no latest: 24.04 solo trae gcc 12/13/14, demasiado nuevos para
    # codigo de 4.9. El kernel original se hizo con Linaro GCC 5.3 de 2016.
    runs-on: ubuntu-22.04
    steps:
      - name: Traer nuestro repo
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Espacio disponible
        run: df -h /

      # OJO: todos los pasos llevan 'set -o pipefail'. El primer intento fallo
      # en silencio porque 'make ... | tail -60' devuelve el codigo del tail, no
      # el del make: dos pasos quedaron marcados success sin haber compilado
      # nada. Ademas cada paso critico verifica su resultado explicitamente.
      - name: Dependencias y toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev build-essential \
            libncurses-dev python3 rsync kmod cpio device-tree-compiler
          # 'linaro5' baja el toolchain con el que se compilo el kernel de
          # fabrica: "gcc version 5.3.1 20160412 (Linaro GCC 5.3-2016.05)",
          # segun su propio banner. El tarball trae ademas el binutils de la
          # epoca, asi que el ensamblador y el linker tambien quedan igualados.
          # Es la ultima variable que separa nuestro build del de fabrica:
          # simbolos, initcalls y config ya se demostraron identicos.
          if [ "${{ github.event.inputs.gcc }}" = "linaro5" ]; then
            # releases.linaro.org ya no sirve archivos (redirige todo a una
            # pagina de contacto); el tarball original sobrevive en el
            # Internet Archive. El sufijo id_ pide los bytes crudos.
            URL="https://web.archive.org/web/20200619152911id_/http://releases.linaro.org/components/toolchain/binaries/5.3-2016.05/aarch64-linux-gnu/gcc-linaro-5.3.1-2016.05-x86_64_aarch64-linux-gnu.tar.xz"
            curl -fL --retry 3 -o /tmp/linaro.tar.xz "$URL"
            SZ=$(stat -c %s /tmp/linaro.tar.xz)
            echo "descargado: $SZ bytes"
            [ "$SZ" -gt 50000000 ] || { echo "ERROR: eso no es el toolchain (¿pagina HTML?)"; exit 1; }
            mkdir -p "$HOME/linaro"
            tar -xJf /tmp/linaro.tar.xz -C "$HOME/linaro" --strip-components=1
            echo "$HOME/linaro/bin" >> "$GITHUB_PATH"
            echo "CCOMP=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "--- compilador elegido ---"
            "$HOME/linaro/bin/aarch64-linux-gnu-gcc" --version | head -1
            exit 0
          fi
          # Se prueban varias versiones porque la disponibilidad cambia entre
          # imagenes del runner. Se usa la primera que instale.
          CC=""
          for v in "${{ github.event.inputs.gcc }}" 9 10 11 12; do
            if sudo apt-get install -y -qq "gcc-$v-aarch64-linux-gnu" 2>/dev/null; then
              CC="aarch64-linux-gnu-gcc-$v"; break
            fi
          done
          if [ -z "$CC" ]; then
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu
            CC="aarch64-linux-gnu-gcc"
          fi
          command -v "$CC" >/dev/null || { echo "ERROR: no hay compilador cruzado"; exit 1; }
          echo "CCOMP=$CC" >> "$GITHUB_ENV"
          echo "--- compilador elegido ---"
          "$CC" --version | head -1

      - name: Clonar el kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch \
            -b "${{ github.event.inputs.kernel_branch }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel
          cd kernel
          echo "--- version del arbol ---"
          head -5 Makefile
          test -d arch/arm64 || { echo "ERROR: el arbol no tiene arch/arm64"; exit 1; }
          du -sh .

      - name: Preparar el config
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          if [ "${{ github.event.inputs.config }}" = "vivo" ]; then
            echo "usando el config EXTRAIDO DE LA CAJA"
            cp ../device_tree/kernel/walley_defconfig .config
          else
            echo "usando el defconfig DEL ARBOL: ${{ github.event.inputs.config }}"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CCOMP" LOCALVERSION= "${{ github.event.inputs.config }}"
          fi
          # El gcc de Ubuntu se llama aarch64-linux-gnu-gcc-N; el kernel espera
          # CROSS_COMPILE + "gcc", asi que se apunta CC directamente.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CCOMP" LOCALVERSION= olddefconfig
          echo "--- diferencias contra el config de la caja ---"
          diff <(grep '^CONFIG' ../device_tree/kernel/walley_defconfig | sort) \
               <(grep '^CONFIG' .config | sort) | head -60 || true
          echo "--- opciones finales: $(grep -c '^CONFIG' .config) ---"

      - name: Compilar
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          # sin pipe a tail: enmascara el codigo de salida
          # LOCALVERSION= es OBLIGATORIO. scripts/setlocalversion agrega un "+" al
          # nombre cuando se compila desde un clon git cuyo HEAD no esta en un tag,
          # y lo hace JUSTAMENTE cuando CONFIG_LOCALVERSION_AUTO esta apagado. El
          # primer build salio "4.9.170+" contra "4.9.170" de fabrica. Con
          # CONFIG_MODVERSIONS=y ese unico caracter cambia el vermagic y los 28
          # modulos del vendor rebotan: sin WiFi y sin GPU. La variable tiene que
          # estar DEFINIDA y vacia, no ausente.
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CCOMP" \
               LOCALVERSION= KCFLAGS="-Wno-error" -j"$(nproc)" Image modules

      # La GPU NO la compila 'make modules'. El Makefile principal solo recorre
      # drivers/ sound/ firmware/, y el driver de Mali vive en modules/gpu/, que
      # queda fuera del arbol: Allwinner lo construye como modulo externo desde
      # su sistema 'lichee'. Por eso el primer build salio sin mali_kbase, y sin
      # ese modulo no hay graficos.
      #
      # modules/gpu/Makefile lee CONFIG_SUNXI_GPU_TYPE del .config del kernel
      # (en esta caja vale "mali-g31") y de ahi deduce que hay que compilar
      # mali-bifrost/driver, que produce mali_kbase.ko y
      # dma-buf-test-exporter.ko. Los dos estan en /vendor/modules de la caja.
      - name: Compilar la GPU (modulo externo)
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          # No todos los arboles traen el driver de Mali. El de OrangePi si (en
          # modules/gpu, fuera del arbol, estilo lichee); el de
          # lineage-on-allwinner no. Sin esta guarda el job falla por algo que
          # no es un error, y encima marca en rojo un kernel que compilo bien.
          if [ ! -d modules/gpu ]; then
            echo "este arbol no trae modules/gpu -- se omite la GPU"
            exit 0
          fi
          mkdir -p ../salida-mod
          # SIN -j en el make de afuera. El Makefile declara 'all: build install'
          # sin dependencia entre los dos targets, asi que con -j corren EN
          # PARALELO y el cp del install busca los .ko antes de que el build los
          # termine ("cp: cannot stat ... No such file"). El make interno ya trae
          # su propio -j, asi que no se pierde paralelismo real.
          #
          # Y no se usa el target 'install': se copian los .ko a mano. Ese target
          # hace un cp con rutas relativas a un LICHEE_MOD_DIR del sistema lichee
          # y es fragil fuera de el.
          make -C modules/gpu \
            LICHEE_KDIR="$PWD" \
            LICHEE_MOD_DIR="$PWD/../salida-mod" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="$CCOMP" LOCALVERSION= \
            build
          echo "--- modulos de GPU generados ---"
          find modules/gpu -name '*.ko' -printf '%10s %p\n' | sort -rn
          mkdir -p ../salida-mod
          find modules/gpu -name '*.ko' -exec cp -v {} ../salida-mod/ \;
          test -f ../salida-mod/mali_kbase.ko || { echo "ERROR: no salio mali_kbase.ko"; exit 1; }

      - name: Verificar el resultado
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          IMG=arch/arm64/boot/Image
          test -f "$IMG" || { echo "ERROR: no se genero el Image"; exit 1; }
          SZ=$(stat -c %s "$IMG")
          echo "  Image      : $SZ bytes"
          echo "  de fabrica : 18651144 bytes"
          echo "  diferencia : $((SZ - 18651144)) bytes"
          echo "  cabe en boot (sobran 14006272 sobre el de fabrica): $([ $SZ -lt 32000000 ] && echo SI || echo NO)"
          MAGIA=$(dd if="$IMG" bs=1 skip=56 count=4 2>/dev/null | xxd -p)
          echo "  magia offset 56: $MAGIA  (debe ser 41524d64 = ARMd)"
          [ "$MAGIA" = "41524d64" ] || { echo "ERROR: no tiene la magia de Image ARM64"; exit 1; }
          echo
          REL=$(cat include/config/kernel.release 2>/dev/null)
          echo "  release: $REL   (de fabrica: 4.9.170)"
          [ "$REL" = "4.9.170" ] || { echo "ERROR: el release no coincide con el de fabrica. Con MODVERSIONS=y esto rompe los 28 modulos del vendor."; exit 1; }
          echo
          N=$(find . -name '*.ko' | wc -l)
          echo "  modulos generados: $N"
          [ "$N" -gt 0 ] || { echo "ERROR: no se genero ningun modulo"; exit 1; }
          find . -name '*.ko' -printf '%10s %f\n' | sort -rn | head -15
          echo
          echo "  --- los que la caja necesita ---"
          for m in mali_kbase dma-buf-test-exporter uvcvideo; do
            F=$(find . -name "$m.ko" | head -1)
            printf '  %-18s %s\n' "$m" "${F:-NO SE GENERO}"
          done

      - name: Empaquetar
        if: always()
        shell: bash
        run: |
          mkdir -p salida/modules
          cp kernel/arch/arm64/boot/Image salida/ 2>/dev/null || true
          cp kernel/.config salida/config-usado 2>/dev/null || true
          cp kernel/include/config/kernel.release salida/ 2>/dev/null || true
          # Module.symvers trae los CRC de todos los simbolos exportados. Es lo que
          # hace falta para comparar contra los que EXIGEN los .ko de fabrica y
          # decidir si el proyecto es viable.
          cp kernel/Module.symvers salida/ 2>/dev/null || true
          find kernel -name '*.ko' -exec cp {} salida/modules/ \; 2>/dev/null || true
          cp salida-mod/*.ko salida/modules/ 2>/dev/null || true
          du -sh salida; ls -l salida

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-walley
          path: salida/
          if-no-files-found: warn
