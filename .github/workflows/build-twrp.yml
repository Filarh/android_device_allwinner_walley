name: Compilar TWRP

"on":
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'Rama del manifiesto TWRP'
        required: true
        default: 'twrp-12.1'
      target:
        description: 'Objetivo (recoveryimage o bootimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # Los runners traen ~72 GB de los que mas de 50 ya estan ocupados.
      # Sin esto no entra el arbol de AOSP.
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Espacio disponible
        run: df -h /

      - name: Traer el device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sincronizar el manifiesto minimo
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@localhost"
          git config --global color.ui false
          mkdir -p twrp && cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.manifest_branch }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Colocar el device tree
        run: |
          mkdir -p twrp/device/allwinner
          cp -r device_tree/device/allwinner/walley twrp/device/allwinner/
          ls -la twrp/device/allwinner/walley

      # lptools YA viene en el arbol, en external/lptools -- aunque no figure en
      # default.xml del manifiesto. Clonarlo aparte en vendor/lptools rompio el
      # build #11 con "module lptools already defined". Aca solo hay que darle
      # recovery_available, porque sin eso Soong no lo instala en el ramdisk del
      # recovery y el binario no aparece (fue lo que paso en el #10).
      #
      # Es la unica herramienta que rehace el mapeo dm-linear con
      # force_writable=true, o sea la unica forma de escribir en
      # system/vendor/product, que en super estan marcadas READONLY.
      - name: Habilitar lptools en el recovery
        run: |
          cd twrp
          BP=$(ls external/lptools/Android.bp vendor/lptools/Android.bp 2>/dev/null | head -1)
          if [ -z "$BP" ]; then echo "ERROR: no encuentro el Android.bp de lptools"; find . -maxdepth 3 -path ./out -prune -o -name Android.bp -path '*lptools*' -print; exit 1; fi
          echo "usando $BP"
          # OJO: tiene que ser 'recovery: true', NO 'recovery_available: true'.
          # No son lo mismo:
          #   recovery_available -> crea una variante de recovery ADEMAS de la
          #     normal. PRODUCT_PACKAGES apunta entonces a la del sistema, que no
          #     se compila cuando solo pedimos 'recoveryimage'. El binario nunca
          #     llega al ramdisk. Fue lo que paso en el #12: el parche se aplico,
          #     el log lo confirmo, y lptools igual no aparecio.
          #   recovery -> el modulo existe SOLO para el recovery y se instala en
          #     el ramdisk. Es lo que usa multi_ir, que si funciona.
          sed -i 's/^\( *\)recovery_available: *true,/\1recovery: true,/' "$BP"
          if grep -qE '^\s*recovery: *true,' "$BP"; then
            echo "ya declara recovery: true"
          else
            sed -i '0,/name: "lptools",/s//name: "lptools",\n    recovery: true,/' "$BP"
            grep -qE '^\s*recovery: *true,' "$BP" || { echo "ERROR: el parche no se aplico"; exit 1; }
          fi
          head -8 "$BP"

      - name: Compilar
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          source build/envsetup.sh
          lunch twrp_walley-eng
          mka ${{ github.event.inputs.target }} -j$(nproc --all)

      - name: Espacio tras compilar
        if: always()
        run: df -h /

      # Corre pase lo que pase. Si el ensamblado final falla por tamano, el arbol
      # del ramdisk YA existe: esto dice exactamente que ocupa, en vez de tener
      # que adivinar que TW_EXCLUDE_* poner en la proxima vuelta.
      - name: Anatomia del ramdisk
        if: always()
        run: |
          O=twrp/out/target/product/walley
          R=$O/recovery/root
          echo "===== piezas de la imagen ====="
          for f in kernel "$O/recovery/kernel" $O/dtb.img $O/ramdisk-recovery.cpio.gz $O/ramdisk-recovery.cpio.lz4; do
            [ -f "$f" ] && printf '%12d  %s\n' "$(stat -c %s "$f")" "$f"
          done
          [ -d "$R" ] || { echo "no existe $R"; exit 0; }
          echo
          echo "===== ramdisk SIN comprimir ====="
          du -sh "$R"
          echo
          echo "===== directorios mas pesados ====="
          du -sk "$R"/* "$R"/system/* 2>/dev/null | sort -rn | head -25
          echo
          echo "===== 40 archivos mas grandes ====="
          find "$R" -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -40 \
            | awk -F'\t' '{printf "%10.1f KB  %s\n", $1/1024, $2}'

      - name: Subir la imagen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-walley
          path: |
            twrp/out/target/product/walley/recovery.img
            twrp/out/target/product/walley/*.img
          if-no-files-found: warn
